<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

/* Notion's iframe becomes the viewport */
#viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* FIXED DESIGN CANVAS
   This is what gets scaled as one complete unit.
*/
#canvas {
    position: absolute;

    width: 600px;
    height: 300px;

    left: 0;
    top: 0;

    transform-origin: top left;
}

/* ==============================
   WEATHER CARD
================================ */

.weather-card {
    width: 600px;
    height: 300px;

    background: #EAF1EE;

    border-radius: 30px;

    padding: 30px 38px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #26312F;

    overflow: hidden;
}


/* LOCATION */

.location {
    font-size: 24px;
    line-height: 30px;

    color: #66736F;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    margin-bottom: 8px;
}


/* CURRENT WEATHER */

.current {
    display: flex;
    align-items: center;

    height: 105px;

    gap: 24px;
}

.weather-icon {
    width: 82px;
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 68px;
    line-height: 1;

    flex-shrink: 0;
}

.temperature {
    font-size: 76px;
    line-height: 70px;

    font-weight: 600;

    letter-spacing: -4px;

    white-space: nowrap;
}

.temperature small {
    font-size: 27px;

    font-weight: 400;

    letter-spacing: 0;

    vertical-align: top;

    margin-left: 3px;
}

.condition {
    font-size: 23px;
    line-height: 28px;

    color: #66736F;

    margin-top: 5px;

    white-space: nowrap;
}


/* FORECAST */

.forecast {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    width: 100%;

    margin-top: 25px;

    gap: 8px;
}

.day {
    text-align: center;

    min-width: 0;
}

.day-name {
    font-size: 17px;
    line-height: 22px;

    color: #74807D;

    margin-bottom: 5px;
}

.day-icon {
    font-size: 27px;

    line-height: 32px;

    height: 34px;
}

.temps {
    display: flex;

    justify-content: center;

    gap: 7px;

    font-size: 16px;

    line-height: 20px;

    white-space: nowrap;
}

.high {
    font-weight: 600;
}

.low {
    color: #8A9591;
}


/* LOADING */

.loading,
.error {
    width: 600px;
    height: 300px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #66736F;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 22px;
}


/* ==============================
   MOBILE / VERY SMALL EMBEDS
================================ */

@media (max-width: 500px) {

    /* Nothing here changes the design.
       The entire canvas is scaled by JS.
    */

}
</style>
</head>

<body>

<div id="viewport">

    <div id="canvas">

        <div class="weather-card">

            <div id="weather">

                <div class="loading">
                    Detecting weather...
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* ==================================================
   FIXED-CANVAS SCALING

   The internal design is always 600 × 300.

   When Notion changes the embed size,
   the ENTIRE design scales proportionally.

   Nothing is cropped.
================================================== */

const canvas =
    document.getElementById("canvas");

const viewport =
    document.getElementById("viewport");


function scaleCanvas() {

    const availableWidth =
        viewport.clientWidth;

    const availableHeight =
        viewport.clientHeight;


    if (
        availableWidth <= 0 ||
        availableHeight <= 0
    ) {
        return;
    }


    const scaleX =
        availableWidth / 600;

    const scaleY =
        availableHeight / 300;


    /* Always use the smaller scale
       so the complete canvas remains visible.
    */

    const scale =
        Math.min(scaleX, scaleY);


    canvas.style.transform =
        `scale(${scale})`;


    /* Center the scaled canvas */

    const scaledWidth =
        600 * scale;

    const scaledHeight =
        300 * scale;


    canvas.style.left =
        `${(availableWidth - scaledWidth) / 2}px`;

    canvas.style.top =
        `${(availableHeight - scaledHeight) / 2}px`;
}


/* Resize whenever Notion changes
   the embed dimensions.
*/

const observer =
    new ResizeObserver(
        scaleCanvas
    );

observer.observe(viewport);

scaleCanvas();


/* ==================================================
   WEATHER
================================================== */

const weatherCodes = {

    0:  ["Clear sky", "☀️"],
    1:  ["Mainly clear", "🌤️"],
    2:  ["Partly cloudy", "⛅"],
    3:  ["Overcast", "☁️"],

    45: ["Fog", "🌫️"],
    48: ["Fog", "🌫️"],

    51: ["Light drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Heavy drizzle", "🌧️"],

    56: ["Freezing drizzle", "🌧️"],
    57: ["Freezing drizzle", "🌧️"],

    61: ["Light rain", "🌦️"],
    63: ["Rain", "🌧️"],
    65: ["Heavy rain", "🌧️"],

    66: ["Freezing rain", "🌧️"],
    67: ["Heavy freezing rain", "🌧️"],

    71: ["Light snow", "🌨️"],
    73: ["Snow", "🌨️"],
    75: ["Heavy snow", "❄️"],

    77: ["Snow grains", "❄️"],

    80: ["Light showers", "🌦️"],
    81: ["Showers", "🌧️"],
    82: ["Heavy showers", "🌧️"],

    85: ["Snow showers", "🌨️"],
    86: ["Heavy snow showers", "❄️"],

    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm", "⛈️"],
    99: ["Thunderstorm", "⛈️"]
};


function weatherInfo(code) {

    return weatherCodes[code] ||
        ["Weather", "🌤️"];

}


/* ==================================================
   AUTOMATIC LOCATION
================================================== */

async function detectLocation() {

    try {

        const response =
            await fetch(
                "https://api.bigdatacloud.net/data/" +
                "reverse-geocode-client" +
                "?localityLanguage=en"
            );


        if (!response.ok) {
            throw new Error(
                "Location unavailable"
            );
        }


        const data =
            await response.json();


        const latitude =
            data.latitude;

        const longitude =
            data.longitude;


        const city =
            data.city ||
            data.locality ||
            data.principalSubdivision ||
            "Local";


        const country =
            data.countryName ||
            "";


        const locationName =
            country
                ? `${city}, ${country}`
                : city;


        await loadWeather(
            latitude,
            longitude,
            locationName
        );


    } catch (error) {

        console.error(error);


        document.getElementById(
            "weather"
        ).innerHTML = `

            <div class="error">
                Weather unavailable
            </div>

        `;

    }

}


/* ==================================================
   LOAD WEATHER
================================================== */

async function loadWeather(
    latitude,
    longitude,
    locationName
) {

    const url =
        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        latitude +

        "&longitude=" +
        longitude +

        "&current=" +
        "temperature_2m," +
        "weather_code" +

        "&daily=" +
        "weather_code," +
        "temperature_2m_max," +
        "temperature_2m_min" +

        "&timezone=auto" +

        "&forecast_days=5";


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Weather unavailable"
        );

    }


    const data =
        await response.json();


    const current =
        data.current;

    const daily =
        data.daily;


    const [
        condition,
        icon
    ] =
        weatherInfo(
            current.weather_code
        );


    /* ==================================================
       FIVE DAY FORECAST
    ================================================== */

    let forecastHTML = "";


    for (
        let i = 0;
        i < daily.time.length;
        i++
    ) {

        const [
            ,
            forecastIcon
        ] =
            weatherInfo(
                daily.weather_code[i]
            );


        const date =
            new Date(
                daily.time[i] +
                "T12:00:00"
            );


        const day =
            i === 0
                ? "Today"
                : date.toLocaleDateString(
                    "en-GB",
                    {
                        weekday: "short"
                    }
                );


        forecastHTML += `

            <div class="day">

                <div class="day-name">
                    ${day}
                </div>

                <div class="day-icon">
                    ${forecastIcon}
                </div>

                <div class="temps">

                    <span class="high">
                        ${Math.round(
                            daily.temperature_2m_max[i]
                        )}°
                    </span>

                    <span class="low">
                        ${Math.round(
                            daily.temperature_2m_min[i]
                        )}°
                    </span>

                </div>

            </div>

        `;

    }


    /* ==================================================
       DISPLAY
    ================================================== */

    document.getElementById(
        "weather"
    ).innerHTML = `

        <div class="location">
            ${locationName}
        </div>


        <div class="current">

            <div class="weather-icon">
                ${icon}
            </div>


            <div>

                <div class="temperature">

                    ${Math.round(
                        current.temperature_2m
                    )}

                    <small>°C</small>

                </div>


                <div class="condition">
                    ${condition}
                </div>

            </div>

        </div>


        <div class="forecast">

            ${forecastHTML}

        </div>

    `;


    /* Recalculate after content loads */

    scaleCanvas();

}


/* ==================================================
   START
================================================== */

detectLocation();


/* Refresh weather every 10 minutes */

setInterval(
    detectLocation,
    10 * 60 * 1000
);

</script>

</body>
</html>
