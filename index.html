<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

.weather-card {
    width: 100%;
    max-width: 590px;

    /* Responsive height instead of fixed height */
    aspect-ratio: 2.05 / 1;

    min-height: 90px;

    background: #E8F1EC;
    border-radius: clamp(14px, 3vw, 22px);

    padding: clamp(14px, 5%, 28px)
             clamp(16px, 6%, 38px);

    color: #393733;

    overflow: hidden;
}


/* LOCATION */

.location {
    font-size: clamp(10px, 2.8vw, 17px);
    color: #66635e;
    margin-bottom: clamp(3px, 1vw, 8px);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* MAIN WEATHER */

.main-weather {
    display: flex;
    align-items: center;
    gap: clamp(7px, 2.5vw, 20px);
}

.weather-icon {
    font-size: clamp(28px, 8vw, 58px);
    line-height: 1;
    flex-shrink: 0;
}

.temperature {
    font-size: clamp(28px, 8vw, 60px);
    font-weight: 600;
    line-height: .9;
    letter-spacing: clamp(-2px, -.4vw, -3px);
    white-space: nowrap;
}

.temperature small {
    font-size: clamp(10px, 3vw, 21px);
    font-weight: 400;
    letter-spacing: 0;
}

.condition {
    margin-top: clamp(3px, 1vw, 8px);
    font-size: clamp(9px, 2.8vw, 17px);
    color: #66635e;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* FORECAST */

.forecast {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: clamp(8px, 3vw, 25px);

    width: 100%;
}

.day {
    text-align: center;
    min-width: 0;
    flex: 1;
}

.day-name {
    font-size: clamp(7px, 2vw, 13px);
    color: #77736d;
    margin-bottom: clamp(2px, .7vw, 7px);
}

.day-icon {
    font-size: clamp(13px, 4vw, 24px);
    height: clamp(17px, 5vw, 30px);
}

.high {
    font-size: clamp(8px, 2.2vw, 14px);
    font-weight: 600;
    margin-top: 2px;
}

.low {
    font-size: clamp(7px, 1.8vw, 12px);
    color: #85817b;
    margin-top: 2px;
}


/* LOADING */

.loading {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    color: #77736d;
    font-size: clamp(10px, 2.5vw, 15px);
}


/* ERROR */

.error {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    color: #77736d;
    font-size: clamp(9px, 2.5vw, 15px);
    text-align: center;
}
</style>
</head>

<body>

<div class="weather-card">

    <div id="weather">
        <div class="loading">
            Detecting location...
        </div>
    </div>

</div>


<script>

const weatherCodes = {

    0:  ["Clear sky", "☀️"],
    1:  ["Mainly clear", "🌤️"],
    2:  ["Partly cloudy", "⛅"],
    3:  ["Overcast", "☁️"],

    45: ["Fog", "🌫️"],
    48: ["Fog", "🌫️"],

    51: ["Light drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Heavy drizzle", "🌧️"],

    56: ["Freezing drizzle", "🌧️"],
    57: ["Freezing drizzle", "🌧️"],

    61: ["Light rain", "🌦️"],
    63: ["Rain", "🌧️"],
    65: ["Heavy rain", "🌧️"],

    66: ["Freezing rain", "🌧️"],
    67: ["Heavy freezing rain", "🌧️"],

    71: ["Light snow", "🌨️"],
    73: ["Snow", "🌨️"],
    75: ["Heavy snow", "❄️"],

    77: ["Snow grains", "❄️"],

    80: ["Light showers", "🌦️"],
    81: ["Showers", "🌧️"],
    82: ["Heavy showers", "🌧️"],

    85: ["Snow showers", "🌨️"],
    86: ["Heavy snow showers", "❄️"],

    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm with hail", "⛈️"],
    99: ["Thunderstorm with hail", "⛈️"]
};


function weatherInfo(code) {

    return weatherCodes[code] ||
        ["Weather", "🌤️"];

}


/* ---------------------------------------
   AUTOMATIC LOCATION
--------------------------------------- */

async function detectLocation() {

    try {

        const response = await fetch(
            "https://api.bigdatacloud.net/data/" +
            "reverse-geocode-client" +
            "?localityLanguage=en"
        );

        if (!response.ok) {
            throw new Error(
                "Location detection failed"
            );
        }

        const data =
            await response.json();

        const latitude =
            data.latitude;

        const longitude =
            data.longitude;

        const city =
            data.city ||
            data.locality ||
            data.principalSubdivision ||
            "";

        const country =
            data.countryName ||
            "";

        let locationName =
            "Local Weather";

        if (city && country) {

            locationName =
                city + ", " + country;

        } else if (city) {

            locationName = city;

        } else if (country) {

            locationName = country;

        }

        await loadWeather(
            latitude,
            longitude,
            locationName
        );

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "weather"
        ).innerHTML = `

            <div class="error">
                Weather temporarily unavailable.
            </div>

        `;

    }

}


/* ---------------------------------------
   WEATHER
--------------------------------------- */

async function loadWeather(
    latitude,
    longitude,
    locationName
) {

    const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + latitude +
        "&longitude=" + longitude +
        "&current=temperature_2m,weather_code" +
        "&daily=weather_code," +
        "temperature_2m_max," +
        "temperature_2m_min" +
        "&timezone=auto" +
        "&forecast_days=5";


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Weather request failed"
        );

    }


    const data =
        await response.json();


    const current =
        data.current;

    const daily =
        data.daily;


    const [
        condition,
        icon
    ] =
        weatherInfo(
            current.weather_code
        );


    /* FORECAST */

    let forecastHTML = "";


    for (
        let i = 0;
        i < daily.time.length;
        i++
    ) {

        const [
            ,
            forecastIcon
        ] =
            weatherInfo(
                daily.weather_code[i]
            );


        const date =
            new Date(
                daily.time[i] +
                "T12:00:00"
            );


        const day =
            i === 0
                ? "Today"
                : date.toLocaleDateString(
                    "en-GB",
                    {
                        weekday: "short"
                    }
                );


        forecastHTML += `

            <div class="day">

                <div class="day-name">
                    ${day}
                </div>

                <div class="day-icon">
                    ${forecastIcon}
                </div>

                <div class="high">
                    ${Math.round(
                        daily
                        .temperature_2m_max[i]
                    )}°
                </div>

                <div class="low">
                    ${Math.round(
                        daily
                        .temperature_2m_min[i]
                    )}°
                </div>

            </div>

        `;

    }


    /* DISPLAY */

    document.getElementById(
        "weather"
    ).innerHTML = `

        <div class="location">
            ${locationName}
        </div>

        <div class="main-weather">

            <div class="weather-icon">
                ${icon}
            </div>

            <div>

                <div class="temperature">

                    ${Math.round(
                        current.temperature_2m
                    )}

                    <small>°C</small>

                </div>

                <div class="condition">
                    ${condition}
                </div>

            </div>

        </div>

        <div class="forecast">

            ${forecastHTML}

        </div>

    `;

}


/* ---------------------------------------
   START
--------------------------------------- */

detectLocation();


/* ---------------------------------------
   REFRESH EVERY 10 MINUTES
--------------------------------------- */

setInterval(
    detectLocation,
    10 * 60 * 1000
);

</script>

</body>
</html>
