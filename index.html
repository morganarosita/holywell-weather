<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

/* ==============================
   WEATHER CARD
   Designed to match the
   approximately 194 × 94px
   greeting card in Notion
================================ */

.weather-card {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;

    background: #EEF3F1;
    border-radius: 16px;

    padding: 10px 13px;

    color: #27312F;

    overflow: hidden;
}


/* LOCATION */

.location {
    width: 100%;

    font-size: 9px;
    line-height: 1.1;

    color: #65716E;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    margin-bottom: 2px;
}


/* MAIN WEATHER */

.main-weather {
    display: flex;
    align-items: center;

    height: 34px;

    gap: 7px;
}

.weather-icon {
    font-size: 25px;
    line-height: 1;

    flex-shrink: 0;
}

.weather-details {
    min-width: 0;
}

.temperature {
    font-size: 29px;
    line-height: 25px;

    font-weight: 600;

    letter-spacing: -1.5px;

    white-space: nowrap;
}

.temperature small {
    font-size: 9px;

    font-weight: 400;

    vertical-align: top;

    letter-spacing: 0;
}

.condition {
    font-size: 8px;
    line-height: 10px;

    color: #65716E;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* ==============================
   5-DAY FORECAST
================================ */

.forecast {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    width: 100%;

    margin-top: 5px;

    gap: 2px;
}

.day {
    min-width: 0;

    text-align: center;
}

.day-name {
    font-size: 7px;
    line-height: 8px;

    color: #77827F;

    white-space: nowrap;
}

.day-icon {
    font-size: 12px;
    line-height: 14px;

    height: 14px;
}

.temps {
    display: flex;
    justify-content: center;
    gap: 2px;

    font-size: 7px;
    line-height: 8px;

    white-space: nowrap;
}

.high {
    font-weight: 600;
}

.low {
    color: #8A9491;
}


/* LOADING */

.loading {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    color: #65716E;

    font-size: 10px;
}


/* ERROR */

.error {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    color: #65716E;

    font-size: 9px;
}
</style>
</head>

<body>

<div class="weather-card">

    <div id="weather">

        <div class="loading">
            Detecting weather...
        </div>

    </div>

</div>


<script>

const weatherCodes = {

    0:  ["Clear sky", "☀️"],
    1:  ["Mainly clear", "🌤️"],
    2:  ["Partly cloudy", "⛅"],
    3:  ["Overcast", "☁️"],

    45: ["Fog", "🌫️"],
    48: ["Fog", "🌫️"],

    51: ["Light drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Heavy drizzle", "🌧️"],

    56: ["Freezing drizzle", "🌧️"],
    57: ["Freezing drizzle", "🌧️"],

    61: ["Light rain", "🌦️"],
    63: ["Rain", "🌧️"],
    65: ["Heavy rain", "🌧️"],

    66: ["Freezing rain", "🌧️"],
    67: ["Heavy freezing rain", "🌧️"],

    71: ["Light snow", "🌨️"],
    73: ["Snow", "🌨️"],
    75: ["Heavy snow", "❄️"],

    77: ["Snow grains", "❄️"],

    80: ["Light showers", "🌦️"],
    81: ["Showers", "🌧️"],
    82: ["Heavy showers", "🌧️"],

    85: ["Snow showers", "🌨️"],
    86: ["Heavy snow showers", "❄️"],

    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm", "⛈️"],
    99: ["Thunderstorm", "⛈️"]
};


function getWeatherInfo(code) {

    return weatherCodes[code] ||
        ["Weather", "🌤️"];

}


/* ==============================
   AUTOMATIC LOCATION
================================ */

async function detectLocation() {

    try {

        const locationResponse = await fetch(
            "https://api.bigdatacloud.net/data/" +
            "reverse-geocode-client" +
            "?localityLanguage=en"
        );

        if (!locationResponse.ok) {
            throw new Error(
                "Location unavailable"
            );
        }

        const location =
            await locationResponse.json();


        const latitude =
            location.latitude;

        const longitude =
            location.longitude;


        const city =
            location.city ||
            location.locality ||
            location.principalSubdivision ||
            "Local";


        const country =
            location.countryName ||
            "";


        const locationName =
            country
                ? city + ", " + country
                : city;


        await loadWeather(
            latitude,
            longitude,
            locationName
        );

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "weather"
        ).innerHTML = `

            <div class="error">
                Weather unavailable
            </div>

        `;

    }

}


/* ==============================
   GET WEATHER
================================ */

async function loadWeather(
    latitude,
    longitude,
    locationName
) {

    const url =
        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        latitude +

        "&longitude=" +
        longitude +

        "&current=" +
        "temperature_2m," +
        "weather_code" +

        "&daily=" +
        "weather_code," +
        "temperature_2m_max," +
        "temperature_2m_min" +

        "&timezone=auto" +

        "&forecast_days=5";


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Weather unavailable"
        );

    }


    const data =
        await response.json();


    const current =
        data.current;

    const daily =
        data.daily;


    const [
        condition,
        icon
    ] =
        getWeatherInfo(
            current.weather_code
        );


    /* ==========================
       FORECAST
    ========================== */

    let forecastHTML = "";


    for (
        let i = 0;
        i < daily.time.length;
        i++
    ) {

        const [
            ,
            forecastIcon
        ] =
            getWeatherInfo(
                daily.weather_code[i]
            );


        const date =
            new Date(
                daily.time[i] +
                "T12:00:00"
            );


        const day =
            i === 0
                ? "Today"
                : date.toLocaleDateString(
                    "en-GB",
                    {
                        weekday: "short"
                    }
                );


        forecastHTML += `

            <div class="day">

                <div class="day-name">
                    ${day}
                </div>

                <div class="day-icon">
                    ${forecastIcon}
                </div>

                <div class="temps">

                    <span class="high">
                        ${Math.round(
                            daily.temperature_2m_max[i]
                        )}°
                    </span>

                    <span class="low">
                        ${Math.round(
                            daily.temperature_2m_min[i]
                        )}°
                    </span>

                </div>

            </div>

        `;

    }


    /* ==========================
       DISPLAY
    ========================== */

    document.getElementById(
        "weather"
    ).innerHTML = `

        <div class="location">
            ${locationName}
        </div>


        <div class="main-weather">

            <div class="weather-icon">
                ${icon}
            </div>


            <div class="weather-details">

                <div class="temperature">

                    ${Math.round(
                        current.temperature_2m
                    )}

                    <small>°C</small>

                </div>


                <div class="condition">
                    ${condition}
                </div>

            </div>

        </div>


        <div class="forecast">

            ${forecastHTML}

        </div>

    `;

}


/* ==============================
   START
================================ */

detectLocation();


/* ==============================
   REFRESH EVERY 10 MINUTES
================================ */

setInterval(
    detectLocation,
    10 * 60 * 1000
);

</script>

</body>
</html>
