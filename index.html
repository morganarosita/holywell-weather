<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

/* Notion's iframe becomes the viewport */
#viewport {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/*
   CARD WRAPPER

   This box always keeps a 2:1 aspect ratio (matching the
   600x300 design) and is sized to fit inside the viewport
   without ever exceeding it in either dimension - the same
   "contain, don't crop" behavior the old JS tried to do,
   but handled natively by the browser's layout engine.

   container-type lets children below use cqw/cqh units,
   which are percentages of THIS element's own box - so
   everything inside scales proportionally no matter what
   size this wrapper ends up being.
*/
#card-wrapper {
    width: min(100%, 200vh);
    aspect-ratio: 2 / 1;
    container-type: inline-size;
}

/* ==============================
   WEATHER CARD
================================ */

.weather-card {
    width: 100%;
    height: 100%;

    background: #EAF1EE;

    border-radius: 5cqw;

    padding: 5cqh 6.3cqw;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #26312F;

    overflow: hidden;
}


/* LOCATION */

.location {
    font-size: 4cqw;
    line-height: 5cqw;

    color: #66736F;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    margin-bottom: 1.3cqw;
}


/* CURRENT WEATHER */

.current {
    display: flex;
    align-items: center;

    height: 17.5cqw;

    gap: 4cqw;
}

.weather-icon {
    width: 13.7cqw;
    height: 13.7cqw;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11.3cqw;
    line-height: 1;

    flex-shrink: 0;
}

.temperature {
    font-size: 12.7cqw;
    line-height: 11.7cqw;

    font-weight: 600;

    letter-spacing: -0.67cqw;

    white-space: nowrap;
}

.temperature small {
    font-size: 4.5cqw;

    font-weight: 400;

    letter-spacing: 0;

    vertical-align: top;

    margin-left: 0.5cqw;
}

.condition {
    font-size: 3.8cqw;
    line-height: 4.7cqw;

    color: #66736F;

    margin-top: 0.8cqw;

    white-space: nowrap;
}


/* FORECAST */

.forecast {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    width: 100%;

    margin-top: 4.2cqw;

    gap: 1.3cqw;
}

.day {
    text-align: center;

    min-width: 0;
}

.day-name {
    font-size: 2.8cqw;
    line-height: 3.7cqw;

    color: #74807D;

    margin-bottom: 0.8cqw;
}

.day-icon {
    font-size: 4.5cqw;

    line-height: 5.3cqw;

    height: 5.7cqw;
}

.temps {
    display: flex;

    justify-content: center;

    gap: 1.2cqw;

    font-size: 2.7cqw;

    line-height: 3.3cqw;

    white-space: nowrap;
}

.high {
    font-weight: 600;
}

.low {
    color: #8A9591;
}


/* LOADING */

.loading,
.error {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #66736F;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 3.7cqw;
}
</style>
</head>

<body>

<div id="viewport">

    <div id="card-wrapper">

        <div class="weather-card">

            <div id="weather">

                <div class="loading">
                    Detecting weather...
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* ==================================================
   WEATHER
================================================== */

const weatherCodes = {

    0:  ["Clear sky", "☀️"],
    1:  ["Mainly clear", "🌤️"],
    2:  ["Partly cloudy", "⛅"],
    3:  ["Overcast", "☁️"],

    45: ["Fog", "🌫️"],
    48: ["Fog", "🌫️"],

    51: ["Light drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Heavy drizzle", "🌧️"],

    56: ["Freezing drizzle", "🌧️"],
    57: ["Freezing drizzle", "🌧️"],

    61: ["Light rain", "🌦️"],
    63: ["Rain", "🌧️"],
    65: ["Heavy rain", "🌧️"],

    66: ["Freezing rain", "🌧️"],
    67: ["Heavy freezing rain", "🌧️"],

    71: ["Light snow", "🌨️"],
    73: ["Snow", "🌨️"],
    75: ["Heavy snow", "❄️"],

    77: ["Snow grains", "❄️"],

    80: ["Light showers", "🌦️"],
    81: ["Showers", "🌧️"],
    82: ["Heavy showers", "🌧️"],

    85: ["Snow showers", "🌨️"],
    86: ["Heavy snow showers", "❄️"],

    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm", "⛈️"],
    99: ["Thunderstorm", "⛈️"]
};


function weatherInfo(code) {

    return weatherCodes[code] ||
        ["Weather", "🌤️"];

}


/* ==================================================
   AUTOMATIC LOCATION
================================================== */

async function detectLocation() {

    try {

        const response =
            await fetch(
                "https://api.bigdatacloud.net/data/" +
                "reverse-geocode-client" +
                "?localityLanguage=en"
            );


        if (!response.ok) {
            throw new Error(
                "Location unavailable"
            );
        }


        const data =
            await response.json();


        const latitude =
            data.latitude;

        const longitude =
            data.longitude;


        const city =
            data.city ||
            data.locality ||
            data.principalSubdivision ||
            "Local";


        const country =
            data.countryName ||
            "";


        const locationName =
            country
                ? `${city}, ${country}`
                : city;


        await loadWeather(
            latitude,
            longitude,
            locationName
        );


    } catch (error) {

        console.error(error);


        document.getElementById(
            "weather"
        ).innerHTML = `

            <div class="error">
                Weather unavailable
            </div>

        `;

    }

}


/* ==================================================
   LOAD WEATHER
================================================== */

async function loadWeather(
    latitude,
    longitude,
    locationName
) {

    const url =
        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        latitude +

        "&longitude=" +
        longitude +

        "&current=" +
        "temperature_2m," +
        "weather_code" +

        "&daily=" +
        "weather_code," +
        "temperature_2m_max," +
        "temperature_2m_min" +

        "&timezone=auto" +

        "&forecast_days=5";


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Weather unavailable"
        );

    }


    const data =
        await response.json();


    const current =
        data.current;

    const daily =
        data.daily;


    const [
        condition,
        icon
    ] =
        weatherInfo(
            current.weather_code
        );


    /* ==================================================
       FIVE DAY FORECAST
    ================================================== */

    let forecastHTML = "";


    for (
        let i = 0;
        i < daily.time.length;
        i++
    ) {

        const [
            ,
            forecastIcon
        ] =
            weatherInfo(
                daily.weather_code[i]
            );


        const date =
            new Date(
                daily.time[i] +
                "T12:00:00"
            );


        const day =
            i === 0
                ? "Today"
                : date.toLocaleDateString(
                    "en-GB",
                    {
                        weekday: "short"
                    }
                );


        forecastHTML += `

            <div class="day">

                <div class="day-name">
                    ${day}
                </div>

                <div class="day-icon">
                    ${forecastIcon}
                </div>

                <div class="temps">

                    <span class="high">
                        ${Math.round(
                            daily.temperature_2m_max[i]
                        )}°
                    </span>

                    <span class="low">
                        ${Math.round(
                            daily.temperature_2m_min[i]
                        )}°
                    </span>

                </div>

            </div>

        `;

    }


    /* ==================================================
       DISPLAY
    ================================================== */

    document.getElementById(
        "weather"
    ).innerHTML = `

        <div class="location">
            ${locationName}
        </div>


        <div class="current">

            <div class="weather-icon">
                ${icon}
            </div>


            <div>

                <div class="temperature">

                    ${Math.round(
                        current.temperature_2m
                    )}

                    <small>°C</small>

                </div>


                <div class="condition">
                    ${condition}
                </div>

            </div>

        </div>


        <div class="forecast">

            ${forecastHTML}

        </div>

    `;

}


/* ==================================================
   START
================================================== */

detectLocation();


/* Refresh weather every 10 minutes */

setInterval(
    detectLocation,
    10 * 60 * 1000
);

</script>

</body>
</html>
